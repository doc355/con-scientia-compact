name: PI
options:
  bundleIdPrefix: ai.polstar.pi
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    visionOS: "1.0"
  createIntermediateGroups: true
packages:
  PIKit:
    path: PIKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Simulator builds only for now: ad-hoc "sign to run locally". Christopher sets DEVELOPMENT_TEAM later.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targetTemplates:
  PIAppCommon:
    type: application
    dependencies:
      - package: PIKit
        product: PIUI
      - package: PIKit
        product: PIKit
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: PI
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PI listens when you tap Talk or a microphone button, to turn your speech into text."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "PI turns your speech into text, on this device when possible, so you can talk to PI."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "PI connects to your PI gateway on your private network (Tailscale)."

targets:
  PI:
    templates: [PIAppCommon]
    platform: iOS
    sources: [Apps/iOS]
    info:
      path: Apps/iOS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net: { NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true }
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.polstar.pi.app
        TARGETED_DEVICE_FAMILY: "1,2"

  PIWatch:
    templates: [PIAppCommon]
    platform: watchOS
    sources: [Apps/watchOS]
    info:
      path: Apps/watchOS/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net: { NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.polstar.pi.watch

  PIVision:
    templates: [PIAppCommon]
    platform: visionOS
    sources: [Apps/visionOS]
    info:
      path: Apps/visionOS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net: { NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true }
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.polstar.pi.vision

  PIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/UITests]
    dependencies:
      - target: PI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.polstar.pi.uitests
        TEST_TARGET_NAME: PI
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PI:
    build: { targets: { PI: all } }
    run: { config: Debug }
    test:
      config: Debug
      targets: [PIUITests]
      environmentVariables:
        PI_TEST_GATEWAY_URL: http://127.0.0.1:8784
  PIWatch:
    build: { targets: { PIWatch: all } }
    run: { config: Debug }
  PIVision:
    build: { targets: { PIVision: all } }
    run: { config: Debug }
